<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobHunter</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>

  <div id="loading">
    <div class="logo-icon">J</div>
    <div class="row" style="gap:.6rem">
      <div class="spinner sm"></div>
      <span class="muted" style="font-size:.85rem">Cargando…</span>
    </div>
  </div>

  <div id="onboarding" class="hidden"></div>

  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">J</div>
        <span>JobHunter <span class="ai">AI</span></span>
      </div>
      <button class="nav-btn active" data-view="run">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Buscar
      </button>
      <button class="nav-btn" data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        Historial
      </button>
      <button class="nav-btn" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Ajustes
      </button>
      <div class="spacer"></div>
      <div id="update-pill" class="update-pill hidden">✦ Nueva version disponible</div>
      <div class="version">v<span id="version">?</span></div>
    </aside>
    <main id="main">
      <section id="view-run" class="view"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>
  </div>

  <div id="toasts"></div>

  <script src="js/bus.js"></script>
  <script src="js/util.js"></script>
  <script src="js/devmock.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/run.js"></script>
  <script src="js/history.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
