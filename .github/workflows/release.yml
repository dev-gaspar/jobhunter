name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller pillow

      - name: Generar assets (icono + wizard)
        run: python desktop/packaging/gen_assets.py

      - name: PyInstaller
        run: pyinstaller --noconfirm desktop/packaging/jobhunter.spec

      - name: Selftest del build congelado
        shell: pwsh
        run: |
          & .\dist\JobHunter\JobHunter.exe --selftest
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:TEMP\jobhunter_selftest.txt" -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content "$env:TEMP\jobhunter_selftest.txt"

      - name: Descargar bootstrapper WebView2
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile desktop/packaging/MicrosoftEdgeWebView2Setup.exe

      - name: Compilar instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (python -c "from jobhunter.constants import VERSION; print(VERSION)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" desktop\packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/JobHunterSetup-x64.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - name: Validar install.sh
        run: bash -n install.sh

      - name: Validar install.ps1
        run: test -f install.ps1

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/JobHunterSetup-x64.exe
            install.sh
            install.ps1
          generate_release_notes: true
          body: |
            ## App de escritorio (Windows)

            Descarga **JobHunterSetup-x64.exe** (abajo en Assets), abrelo y listo.
            Sin dependencias: no necesitas Python, Git ni terminal.

            > Windows SmartScreen puede mostrar un aviso la primera vez
            > (instalador sin firma). Pulsa "Mas informacion" y luego
            > "Ejecutar de todas formas".

            ## Instalacion por consola (CLI)

            **macOS / Linux:**
            ```bash
            curl -sSL https://raw.githubusercontent.com/dev-gaspar/jobhunter/main/install.sh | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/dev-gaspar/jobhunter/main/install.ps1 | iex
            ```
